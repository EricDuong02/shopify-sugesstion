<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">Shopify Suggestion Database ERD</title>
  <desc id="desc">Entity relationship diagram for the current Prisma database schema.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Inter, Arial, sans-serif; fill: #475569; }
      .group-title { font: 700 16px Inter, Arial, sans-serif; fill: #334155; }
      .entity { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .entity-header { fill: #e2e8f0; }
      .catalog-header { fill: #dbeafe; }
      .recommender-header { fill: #fef3c7; }
      .chat-header { fill: #dcfce7; }
      .auth-header { fill: #f3e8ff; }
      .entity-name { font: 700 15px Inter, Arial, sans-serif; fill: #0f172a; }
      .field { font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .key { font-weight: 700; fill: #0369a1; }
      .relation { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
      .relation-dashed { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrow-dashed); }
      .relation-label { font: 400 11px Inter, Arial, sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .legend { font: 400 12px Inter, Arial, sans-serif; fill: #475569; }
      .note { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.2; rx: 6; }
      .note-text { font: 400 12px Inter, Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1900" height="1320"/>
  <text class="title" x="50" y="48">Shopify Suggestion — Database ERD</text>
  <text class="subtitle" x="50" y="74">Generated from server/prisma/schema.prisma · solid lines = Prisma FK relations · dashed lines = logical shop/product scope without FK</text>

  <!-- Relationship lines are behind entities. -->
  <!-- Recommender relationships -->
  <path class="relation" d="M435 285 C475 285 475 330 510 330"/>
  <text class="relation-label" x="448" y="320">1 : N</text>
  <path class="relation" d="M435 305 C470 305 470 495 510 495"/>
  <text class="relation-label" x="447" y="415">1 : 0..1</text>
  <path class="relation" d="M435 325 C480 325 480 660 510 660"/>
  <text class="relation-label" x="445" y="520">1 : 0..1</text>
  <path class="relation" d="M670 205 C700 205 700 530 735 530"/>
  <text class="relation-label" x="680" y="365">1 : N</text>
  <path class="relation" d="M670 370 C705 370 705 570 735 570"/>
  <text class="relation-label" x="684" y="470">1 : N</text>
  <path class="relation" d="M670 535 C705 535 705 610 735 610"/>
  <text class="relation-label" x="686" y="590">1 : N</text>
  <path class="relation" d="M860 585 L920 585"/>
  <text class="relation-label" x="875" y="575">1 : N</text>

  <!-- Catalog relationships -->
  <path class="relation" d="M1240 245 C1280 245 1280 150 1320 150"/>
  <text class="relation-label" x="1250" y="198">1 : N</text>
  <path class="relation" d="M1240 270 C1280 270 1280 390 1320 390"/>
  <text class="relation-label" x="1252" y="350">1 : N</text>
  <path class="relation" d="M1240 295 C1280 295 1280 630 1320 630"/>
  <text class="relation-label" x="1250" y="500">1 : N</text>
  <path class="relation" d="M670 330 C920 330 980 230 1080 230"/>
  <text class="relation-label" x="850" y="285">N : 1</text>
  <path class="relation-dashed" d="M1080 325 C1010 325 1010 760 1240 760"/>
  <text class="relation-label" x="1050" y="545">logical key: shopId + productId</text>

  <!-- Chat relationship -->
  <path class="relation" d="M435 925 C500 925 500 1030 545 1030"/>
  <text class="relation-label" x="455" y="985">1 : N</text>

  <!-- Auth / application group -->
  <text class="group-title" x="50" y="112">Auth &amp; application</text>
  <rect class="entity" x="50" y="130" width="385" height="125"/>
  <rect class="auth-header" x="50" y="130" width="385" height="32" rx="8"/>
  <text class="entity-name" x="66" y="151">Shop</text>
  <text class="field key" x="66" y="181">PK id : String</text>
  <text class="field" x="66" y="199">UK name : String</text>
  <text class="field" x="66" y="217">token : String?</text>

  <rect class="entity" x="50" y="285" width="385" height="125"/>
  <rect class="auth-header" x="50" y="285" width="385" height="32" rx="8"/>
  <text class="entity-name" x="66" y="306">AppSession</text>
  <text class="field key" x="66" y="336">PK id : String</text>
  <text class="field" x="66" y="354">shop : String</text>
  <text class="field" x="66" y="372">payload : Json</text>

  <rect class="entity" x="50" y="440" width="385" height="125"/>
  <rect class="auth-header" x="50" y="440" width="385" height="32" rx="8"/>
  <text class="entity-name" x="66" y="461">Tokens</text>
  <text class="field key" x="66" y="491">PK id : Int</text>
  <text class="field" x="66" y="509">UK token : String</text>
  <text class="field" x="66" y="527">name : String?</text>
  <text class="field" x="66" y="545">createdAt / updatedAt</text>

  <rect class="entity" x="50" y="595" width="385" height="145"/>
  <rect class="auth-header" x="50" y="595" width="385" height="32" rx="8"/>
  <text class="entity-name" x="66" y="616">ChatShopConfig</text>
  <text class="field key" x="66" y="646">PK id : Int</text>
  <text class="field" x="66" y="664">UK shopId : String</text>
  <text class="field" x="66" y="682">llmProvider / llmModel</text>
  <text class="field" x="66" y="700">publicToken : String (UK)</text>
  <text class="field" x="66" y="718">rateLimit / fallback / budget</text>

  <!-- Recommender group -->
  <text class="group-title" x="510" y="112">Recommender configuration</text>
  <rect class="entity" x="510" y="295" width="320" height="125"/>
  <rect class="recommender-header" x="510" y="295" width="320" height="32" rx="8"/>
  <text class="entity-name" x="526" y="316">OfferProductItem</text>
  <text class="field key" x="526" y="346">PK id : Int</text>
  <text class="field" x="526" y="364">FK offerProductId : Int</text>
  <text class="field" x="526" y="382">FK shopId + productId</text>
  <text class="field" x="526" y="400">position / source</text>

  <rect class="entity" x="510" y="460" width="320" height="125"/>
  <rect class="recommender-header" x="510" y="460" width="320" height="32" rx="8"/>
  <text class="entity-name" x="526" y="481">TriggerProduct</text>
  <text class="field key" x="526" y="511">PK id : Int</text>
  <text class="field" x="526" y="529">FK_UK offerProductId</text>
  <text class="field" x="526" y="547">pageIds : Int[]</text>
  <text class="field" x="526" y="565">scheduleOn : Boolean</text>

  <rect class="entity" x="510" y="625" width="320" height="125"/>
  <rect class="recommender-header" x="510" y="625" width="320" height="32" rx="8"/>
  <text class="entity-name" x="526" y="646">FallBackProduct</text>
  <text class="field key" x="526" y="676">PK id : Int</text>
  <text class="field" x="526" y="694">FK_UK offerProductId</text>
  <text class="field" x="526" y="712">fallback product groups</text>

  <rect class="entity" x="510" y="790" width="320" height="125"/>
  <rect class="recommender-header" x="510" y="790" width="320" height="32" rx="8"/>
  <text class="entity-name" x="526" y="811">OfferProduct</text>
  <text class="field key" x="526" y="841">PK id : Int</text>
  <text class="field" x="526" y="859">shopId : String?</text>
  <text class="field" x="526" y="877">name : String</text>
  <text class="field" x="526" y="895">placeId : Int</text>

  <rect class="entity" x="920" y="500" width="300" height="125"/>
  <rect class="recommender-header" x="920" y="500" width="300" height="32" rx="8"/>
  <text class="entity-name" x="936" y="521">ProductGroups</text>
  <text class="field key" x="936" y="551">PK id : Int</text>
  <text class="field" x="936" y="569">typeId : String[]</text>
  <text class="field" x="936" y="587">ids : String[]</text>
  <text class="field" x="936" y="605">FK offer / trigger / fallback</text>

  <rect class="entity" x="920" y="665" width="300" height="125"/>
  <rect class="recommender-header" x="920" y="665" width="300" height="32" rx="8"/>
  <text class="entity-name" x="936" y="686">Rules</text>
  <text class="field key" x="936" y="716">PK id : Int</text>
  <text class="field" x="936" y="734">FK productGroupsId : Int?</text>
  <text class="field" x="936" y="752">column / relation : Int</text>
  <text class="field" x="936" y="770">value : String[]</text>

  <!-- Catalog group -->
  <text class="group-title" x="1080" y="112">AI catalog &amp; semantic search</text>
  <rect class="entity" x="1080" y="130" width="360" height="195"/>
  <rect class="catalog-header" x="1080" y="130" width="360" height="32" rx="8"/>
  <text class="entity-name" x="1096" y="151">CatalogProduct</text>
  <text class="field key" x="1096" y="181">PK id : Int</text>
  <text class="field key" x="1096" y="199">UK shopId + shopifyProductId</text>
  <text class="field" x="1096" y="217">title / handle / description</text>
  <text class="field" x="1096" y="235">vendor / productType / tags</text>
  <text class="field" x="1096" y="253">status / onlineStoreUrl</text>
  <text class="field" x="1096" y="271">minPrice / maxPrice / currency</text>
  <text class="field" x="1096" y="289">publishedAt / Shopify timestamps</text>
  <text class="field" x="1096" y="307">createdAt / updatedAt</text>

  <rect class="entity" x="1320" y="80" width="360" height="180"/>
  <rect class="catalog-header" x="1320" y="80" width="360" height="32" rx="8"/>
  <text class="entity-name" x="1336" y="101">CatalogVariant</text>
  <text class="field key" x="1336" y="131">PK id : Int</text>
  <text class="field key" x="1336" y="149">UK shopId + variantId</text>
  <text class="field" x="1336" y="167">FK shopId + productId</text>
  <text class="field" x="1336" y="185">sku / barcode / title</text>
  <text class="field" x="1336" y="203">price / compareAtPrice</text>
  <text class="field" x="1336" y="221">availableForSale / inventory</text>
  <text class="field" x="1336" y="239">selectedOptions : Json</text>

  <rect class="entity" x="1320" y="330" width="360" height="145"/>
  <rect class="catalog-header" x="1320" y="330" width="360" height="32" rx="8"/>
  <text class="entity-name" x="1336" y="351">CatalogOption</text>
  <text class="field key" x="1336" y="381">PK id : Int</text>
  <text class="field key" x="1336" y="399">UK shopId + productId + name</text>
  <text class="field" x="1336" y="417">FK shopId + productId</text>
  <text class="field" x="1336" y="435">name : String</text>
  <text class="field" x="1336" y="453">values : String[] / position</text>

  <rect class="entity" x="1320" y="570" width="360" height="195"/>
  <rect class="catalog-header" x="1320" y="570" width="360" height="32" rx="8"/>
  <text class="entity-name" x="1336" y="591">ProductEmbedding</text>
  <text class="field key" x="1336" y="621">PK id : Int</text>
  <text class="field key" x="1336" y="639">UK shopId + productId + chunkType</text>
  <text class="field" x="1336" y="657">embedding : vector(768)</text>
  <text class="field" x="1336" y="675">text / contentHash</text>
  <text class="field" x="1336" y="693">productTitle / productHandle</text>
  <text class="field" x="1336" y="711">productUrl / productImageUrl</text>
  <text class="field" x="1336" y="729">price : Float?</text>
  <text class="field" x="1336" y="747">No Prisma FK to CatalogProduct</text>

  <!-- Chat group -->
  <text class="group-title" x="50" y="850">AI chat conversations</text>
  <rect class="entity" x="50" y="870" width="385" height="125"/>
  <rect class="chat-header" x="50" y="870" width="385" height="32" rx="8"/>
  <text class="entity-name" x="66" y="891">ChatSession</text>
  <text class="field key" x="66" y="921">PK id : String</text>
  <text class="field" x="66" y="939">shopId : String</text>
  <text class="field" x="66" y="957">startedAt / endedAt</text>
  <text class="field" x="66" y="975">messages : ChatMessage[]</text>

  <rect class="entity" x="545" y="970" width="385" height="160"/>
  <rect class="chat-header" x="545" y="970" width="385" height="32" rx="8"/>
  <text class="entity-name" x="561" y="991">ChatMessage</text>
  <text class="field key" x="561" y="1021">PK id : Int</text>
  <text class="field" x="561" y="1039">FK sessionId : String</text>
  <text class="field" x="561" y="1057">role / content</text>
  <text class="field" x="561" y="1075">tokensIn / tokensOut</text>
  <text class="field" x="561" y="1093">latencyMs / fallbackUsed</text>
  <text class="field" x="561" y="1111">fallbackReason / createdAt</text>

  <!-- Notes -->
  <rect class="note" x="1080" y="840" width="600" height="110"/>
  <text class="note-text" x="1100" y="867">Tenant scope:</text>
  <text class="note-text" x="1100" y="887">shopId/shop are used to isolate shops, but the current schema</text>
  <text class="note-text" x="1100" y="905">does not define a foreign key to Shop. ProductEmbedding also</text>
  <text class="note-text" x="1100" y="923">links logically to CatalogProduct by shopId + shopifyProductId.</text>

  <!-- Legend -->
  <line x1="50" y1="1210" x2="105" y2="1210" class="relation"/>
  <text class="legend" x="118" y="1214">Prisma foreign-key relation</text>
  <line x1="300" y1="1210" x2="355" y2="1210" class="relation-dashed"/>
  <text class="legend" x="368" y="1214">Logical relation / no FK</text>
  <text class="legend" x="650" y="1214">PK = primary key · UK = unique constraint · FK = foreign key</text>
</svg>
